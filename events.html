<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riverbend Yoga Studio - Events</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="yoga-logo_c.png" alt="Riverbend Yoga Studio logo">
    <h1>Events and Workshops</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="events.html">Events</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Upcoming Workshop</h2>
      <img src="yoga-workshop_c.png" alt="Group of people practicing yoga in a bright studio">
      <p>Join us on the first Saturday of the month at 11:00 AM for a beginner breathing and stretching workshop. All mats and props are provided.</p>
    </section>

    <section>
      <h2>Sign Up</h2>
      <form id="request-form" novalidate>
        <fieldset>
          <legend>Request a Spot</legend>

          <label for="name">Name:</label>
          <input type="text" id="name" name="name">
          <p class="error-msg" id="name-error"></p>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email">
          <p class="error-msg" id="email-error"></p>

          <label for="interest">Class or Event:</label>
          <select id="interest" name="interest">
            <option value="gentle">Gentle Yoga</option>
            <option value="vinyasa">Vinyasa</option>
            <option value="restorative">Restorative Yoga</option>
          </select>

          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="4"></textarea>
          <p class="error-msg" id="message-error"></p>

          <button type="submit">Send Request</button>
          <p id="form-status"></p>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <p>Riverbend Yoga Studio - 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
